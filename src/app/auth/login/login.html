<div class="login-page-container">
  <!-- Tarjeta azul oscura -->
  <div class="login-card">
    <div class="login-content">
      
      <!-- Títulos -->
      <h1 class="login-title">Bienvenido de Vuelta</h1>
      <p class="login-subtitle">Ingresa tus credenciales para acceder</p>

      <!-- Formulario -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        
        <!-- Campo Usuario -->
        <div class="form-group">
          <label for="username" class="form-label">Usuario</label>
          <input 
            id="username"
            type="text"
            formControlName="username"
            class="form-input"
            placeholder="Ingresa tu usuario"
            required
          >
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group password-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-with-icon">
            <input 
              id="password"
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              class="form-input"
              placeholder="Ingresa tu contraseña"
              required
            />
            <!-- Icono SVG del ojo -->
            <button 
              type="button" 
              class="password-toggle-icon" 
              (click)="togglePasswordVisibility()"
              aria-label="Mostrar u ocultar contraseña"
            >
              <!-- Icono de "Ojo" (mostrado cuando hidePassword es true) -->
              <svg *ngIf="hidePassword" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <!-- Icono de "Ojo tachado" (mostrado cuando hidePassword es false) -->
              <svg *ngIf="!hidePassword" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.94 17.94C16.2306 19.3624 14.1161 20.1151 11.94 20C4.94 20 0.94 12 0.94 12C0.94 12 3.51 6.82 7.94 4.94" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M16.5 7.5C18.82 8.95 19.94 12 19.94 12C19.94 12 17.5 16.82 13.18 18.7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 9C12.7956 9 13.5587 9.31607 14.1213 9.87868C14.6839 10.4413 15 11.2044 15 12C15 12.7956 14.6839 13.5587 14.1213 14.1213C13.5587 14.6839 12.7956 15 12 15C11.2044 15 10.4413 14.6839 9.87868 14.1213C9.31607 13.5587 9 12.7956 9 12C9 11.2044 9.31607 10.4413 9.87868 9.87868C10.4413 9.31607 11.2044 9 12 9Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="1" y1="1" x2="23" y2="23" stroke="white" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Botón Iniciar Sesión -->
        <button type="submit" class="submit-button" [disabled]="loginForm.invalid">
          Iniciar Sesión
        </button>

      </form>
    </div>
  </div>
</div>
